    <!-- Structured Data: JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://yartrader.com/#organization",
          "name": "YarTrader",
          "url": "https://yartrader.com",
          "logo": "https://yartrader.com/logo.png",
          "description": "Autonomous Financial Intelligence Platform for structural market analysis, risk controls, and prop firm challenge monitoring."
        },
        {
          "@type": "WebSite",
          "@id": "https://yartrader.com/#website",
          "url": "https://yartrader.com",
          "name": "YarTrader",
          "publisher": {
            "@id": "https://yartrader.com/#organization"
          }
        },
        {
          "@type": "SoftwareApplication",
          "name": "YarTrader Terminal",
          "operatingSystem": "Web",
          "applicationCategory": "FinanceApplication",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://yartrader.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is YarTrader?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "YarTrader is an autonomous financial intelligence platform for non-linear price structure analysis, risk management, and prop firm challenge evaluation. It is not a broker and does not hold user deposits."
              }
            },
            {
              "@type": "Question",
              "name": "Is YarTrader a broker?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No, YarTrader is not a broker, liquidity provider, or investment manager. It provides pure structural market analysis software and risk compliance tooling."
              }
            },
            {
              "@type": "Question",
              "name": "Does YarTrader execute live trades?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Live real-money trading is hard-blocked repository-wide (LIVE_TRADING_ENABLED = False). Execution is strictly restricted to simulated backtesting, MT5 demo accounts, and virtual paper shadow trading."
              }
            }
          ]
        }
      ]
    }
    </script>
