name: Temporary Source Code ZIP Export

on:
  push:
    branches:
      - "temp/source-code-export-*"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Package code files only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path(".")
          out = Path("YarTrader-source-code-only.zip")
          allowed = {
              ".py", ".pyi", ".js", ".jsx", ".ts", ".tsx", ".mjs", ".cjs",
              ".css", ".scss", ".sass", ".html", ".htm", ".sql", ".sh",
              ".ps1", ".bat", ".cmd", ".json", ".toml", ".ini", ".cfg",
              ".xml", ".yml", ".yaml"
          }
          exact_names = {
              "requirements.txt", "pytest.ini", "package.json",
              "package-lock.json", "pnpm-lock.yaml", "yarn.lock",
              "pyproject.toml", "tsconfig.json", "vite.config.ts",
              "vite.config.js", "next.config.js", "next.config.ts"
          }
          excluded_dirs = {
              ".git", ".github", ".venv", "venv", "node_modules",
              "__pycache__", ".pytest_cache", "dist", "build",
              "coverage", "docs", "tests", "test", "data", "deploy",
              "frontend-audit", "YarTrader-Frontend-Spec", "validation"
          }
          excluded_root_files = {
              ".env", ".env.production", ".env.production.example",
              ".gitignore", "README.md", "CHANGELOG.md"
          }
          count = 0
          with ZipFile(out, "w", ZIP_DEFLATED, compresslevel=8) as z:
              for p in root.rglob("*"):
                  if not p.is_file() or p == out:
                      continue
                  rel = p.relative_to(root)
                  parts = set(rel.parts)
                  if parts & excluded_dirs:
                      continue
                  if any(part.startswith(".") and part not in {".well-known"} for part in rel.parts):
                      continue
                  if p.name in excluded_root_files or p.name.startswith(".env"):
                      continue
                  if p.suffix.lower() not in allowed and p.name not in exact_names:
                      continue
                  if any(part.lower() in {"test", "tests", "spec", "specs"} for part in rel.parts[:-1]):
                      continue
                  z.write(p, rel.as_posix())
                  count += 1
          print(f"Created {out} with {count} source/config files; secrets, docs, tests, data and build artifacts excluded.")
          PY
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: YarTrader-source-code-only
          path: YarTrader-source-code-only.zip
          retention-days: 7
