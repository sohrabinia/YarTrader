name: YarTrader Autonomous Release Gate & Production Health Verification

on:
  push:
    branches:
      - main
      - master

jobs:
  partitioned-backend-validation:
    name: Release Backend Validation (${{ matrix.partition_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition_index: 0, partition_name: "Gate 1 Suite" }
          - { partition_index: 1, partition_name: "Gate 2 Suite" }
          - { partition_index: 2, partition_name: "Forensic Safety Suite" }
          - { partition_index: 3, partition_name: "Risk Subsystem" }
          - { partition_index: 4, partition_name: "Brain Subsystem" }
          - { partition_index: 5, partition_name: "Dashboard Subsystem" }
          - { partition_index: 6, partition_name: "Learning Subsystem" }
          - { partition_index: 7, partition_name: "Execution Subsystem" }
          - { partition_index: 8, partition_name: "Universe Subsystem" }
          - { partition_index: 9, partition_name: "Pipeline Subsystem" }
          - { partition_index: 10, partition_name: "Backtesting Subsystem" }
          - { partition_index: 11, partition_name: "Agents & Growth" }
          - { partition_index: 12, partition_name: "Audit & SDDL & Compliance" }
          - { partition_index: 13, partition_name: "Integration & Services & Shadow" }
          - { partition_index: 14, partition_name: "Data & Timeframes & Providers & Monitoring" }
          - { partition_index: 15, partition_name: "Architecture & Intelligence & Knowledge & Orchestration & Research" }
          - { partition_index: 16, partition_name: "Remaining General Tests" }

    steps:
      - name: Checkout Release Candidate Commit
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deterministic Backend Validation Partition
        env:
          VALIDATION_PARTITION_INDEX: ${{ matrix.partition_index }}
          PYTHONPATH: .
        run: |
          python validate_release.py

  release-gate-and-health-check:
    name: Release Frontend, Formatting & Health Gate
    needs: partitioned-backend-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: yartrader-production-release
      cancel-in-progress: false

    steps:
      - name: Checkout Release Candidate Commit
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'trader-terminal/package-lock.json'

      - name: Deterministic Gate 2 — Frontend Production Build Compilation
        run: |
          cd trader-terminal
          npm ci
          npm run build

      - name: Deterministic Gate 3 — Git Formatting & Whitespace Validation
        run: |
          git diff --check

      - name: Execute Fail-Closed Production Health Verification
        run: |
          python3 -c "
          import urllib.request, time

          urls = [
              'https://yartrader.com/',
              'https://yartrader.com/fa/',
              'https://yartrader.com/fa/pricing',
              'https://yartrader.com/fa/guide',
              'https://yartrader.com/fa/faq',
              'https://yartrader.com/en/',
              'https://yartrader.com/tr/',
              'https://yartrader.com/ar/'
          ]

          all_passed = True
          for url in urls:
              passed = False
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
                      res = urllib.request.urlopen(req, timeout=10)
                      code = res.status
                      final_url = res.geturl()
                      if 200 <= code < 400 and '#' not in final_url:
                          print(f' [HTTP {code} OK] {url}')
                          passed = True
                          break
                  except Exception:
                      time.sleep(2)
              if not passed:
                  print(f' [FAIL / UNVERIFIED] {url}')
                  all_passed = False

          font_url = 'https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2'
          try:
              req_f = urllib.request.Request(font_url, headers={'User-Agent': 'Mozilla/5.0'})
              res_f = urllib.request.urlopen(req_f, timeout=10)
              print(f' [FONT OK] Vazirmatn WOFF2 Asset Status {res_f.status}')
          except Exception as e:
              print(f' [FONT FAIL] Vazirmatn Asset Failed: {e}')
              all_passed = False

          if not all_passed:
              raise SystemExit('PRODUCTION HEALTH VERIFICATION FAILED! Release Candidate Rejected.')
          "
