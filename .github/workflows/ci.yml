name: TradeYar AI CI/CD Readiness Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Platform Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f deploy/requirements.txt ]; then pip install -r deploy/requirements.txt; fi
        pip install pytest pytest-cov

    - name: Execute Autonomous Tests Suite
      env:
        RG_ENV: test
        TradeYarStorageRoot: /tmp/TradeYarAI/
      run: |
        PYTHONPATH=. pytest --cov=src --cov-report=xml

    - name: Validate Strict APES-FIN Non-Trading Security Boundaries
      run: |
        python src/Application/Audit/compliance_scanner.py src
