jobs:
  sequential-cycle-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile strategy and research modules
        run: |
          python -m py_compile \
            scripts/run_sequential_market_learning_cycle.py \
            src/Decision/Intelligence/base_reaction_decision_engine.py \
            src/Decision/Intelligence/pending_order_planner.py \
            src/Research/Brain/multitimeframe_base_transition_engine.py \
            src/Decision/Intelligence/hierarchical_base_behavior_engine.py \
            src/Decision/Intelligence/multitimeframe_base_behavior_monitor.py \
            src/Execution/Services/autonomous_demo_trader.py \
            src/Intelligence/Execution/strategy_orchestrator.py \
            src/Intelligence/Execution/core.py \
            src/Intelligence/Execution/execution_planner.py \
            src/Risk/Services/reversal_handoff.py \
            src/Application/Runtime/research_runtime.py \
            src/Application/Backtesting/backtest_learning_engine.py
      - name: Run Base-only engine, MTF, and persistence regressions
        run: |
          python -m pytest -q \
            tests/YarTrader.Tests/Backtesting/test_sequential_market_learning_cycle.py \
            tests/YarTrader.Tests/Backtesting/test_mt5_mtf_backtest.py \
            tests/YarTrader.Tests/Decision/test_base_reaction_decision_engine.py \
            tests/YarTrader.Tests/Decision/test_pending_order_planner.py \
            tests/YarTrader.Tests/Execution/test_autonomous_demo_runtime.py \
            tests/YarTrader.Tests/Intelligence/test_strategy_orchestrator.py \
            tests/YarTrader.Tests/Intelligence/test_multi_timeframe_execution_plans.py \
            tests/YarTrader.Tests/Intelligence/test_true_mtf_brain_runtime.py \
            tests/YarTrader.Tests/Intelligence/test_true_mtf_causal_isolation.py \
            tests/YarTrader.Tests/Research/test_live_decision_indicator_free.py \
            tests/YarTrader.Tests/Execution/test_phase_b_reversal_risk.py \
            tests/YarTrader.Tests/Risk/test_multi_level_risk_and_reversal.py \
            tests/YarTrader.Tests/Decision/test_professional_signal_integration.py \
            tests/YarTrader.Tests/Decision/test_hierarchical_base_behavior_engine.py \
            tests/YarTrader.Tests/Decision/test_multitimeframe_base_behavior_monitor.py \
            tests/test_multitimeframe_base_transition_engine.py \
            tests/test_research_snapshot_persistence.py
      - name: Run targeted Base-only runtime and API acceptance tests
        run: |
          python -m pytest -q \
            tests/YarTrader.Tests/Runtime/test_research_runtime.py::TestResearchRuntimeAndAdapter::test_base_runtime_loads_adjacent_parent_and_child_timeframes \
            tests/YarTrader.Tests/Runtime/test_research_runtime.py::TestResearchRuntimeAndAdapter::test_runtime_rejects_legacy_brain_engine_at_constructor \
            tests/YarTrader.Tests/Runtime/test_research_runtime.py::TestResearchRuntimeAndAdapter::test_strict_read_only_compliance_no_trading_api \
            tests/YarTrader.Tests/Services/test_web_dashboard.py::TestWebDashboardFastAPI::test_trigger_backtesting_job_uses_base_only_and_real_history \
            tests/YarTrader.Tests/Services/test_web_dashboard.py::TestWebDashboardFastAPI::test_get_health_diagnostics \
            tests/YarTrader.Tests/Intelligence/test_strategy_orchestrator.py::TestStrategyOrchestrator::test_latest_base_reaction_uses_actual_side_and_depth
