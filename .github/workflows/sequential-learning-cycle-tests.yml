name: Sequential Research Cycle Tests

on:
  pull_request:
    paths:
      - "scripts/run_sequential_market_learning_cycle.py"
      - "tests/YarTrader.Tests/Backtesting/test_sequential_market_learning_cycle.py"
      - ".github/workflows/sequential-learning-cycle-tests.yml"
  push:
    branches:
      - feature/base-behavior-memory-20261010
    paths:
      - "scripts/run_sequential_market_learning_cycle.py"
      - "tests/YarTrader.Tests/Backtesting/test_sequential_market_learning_cycle.py"
      - ".github/workflows/sequential-learning-cycle-tests.yml"

jobs:
  sequential-cycle-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile research-cycle script
        run: python -m py_compile scripts/run_sequential_market_learning_cycle.py
      - name: Run focused unit tests
        run: python -m pytest -q tests/YarTrader.Tests/Backtesting/test_sequential_market_learning_cycle.py
